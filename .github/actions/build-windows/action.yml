name: Build Windows binary
description: >
  Build cataclysm-tiles.exe via MSVC + vcpkg (SDL3), mirroring upstream's
  msvc-full-features.yml build. Packages into Cddacoop/ folder, zips, and
  uploads as cddacoop-windows-x64.

# WHY MSVC+vcpkg (not MSYS2/MinGW): this is the toolchain CleverRaven ships
# Windows with. Mirroring it keeps us in parity — vcpkg.json, the overlay
# triplets, and the msvc-full-features/*.vcxproj solution all merge straight
# from upstream, so future merges touch zero of our packaging code. The build
# step below is a near-verbatim copy of upstream .github/workflows/
# msvc-full-features.yml; only the version stamp + ZIP packaging are ours.

inputs:
  version:
    description: 'Version string used for the ZIP filename (e.g. v0.1.0 or test-20260523-a1b2c3d).'
    required: true

outputs:
  zip-path:
    description: 'Filesystem path of the produced ZIP, relative to the repo root.'
    value: ${{ steps.package.outputs.zip-path }}

runs:
  using: composite
  steps:
    # --- upstream build steps (msvc-full-features.yml), verbatim ---------------
    - name: Setup msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: mingw64
        install: >-
          gettext
          make
          zip

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Use GNU tar to enable zstd for actions/cache
      shell: cmd
      run: |
        echo Adding GNU tar to PATH
        echo C:\Program Files\Git\usr\bin>>"%GITHUB_PATH%"

    - name: Install stable CMake
      uses: lukka/get-cmake@latest
      with:
        # 4.0.0 has issues compiling old packages (upstream pin)
        cmakeVersion: 3.31.6

    - name: Install vcpkg
      uses: lukka/run-vcpkg@v11.6
      id: runvcpkg
      with:
        vcpkgDirectory: '${{ runner.workspace }}/b/vcpkg'
        # Must equal builtin-baseline in msvc-full-features/vcpkg.json.
        vcpkgGitCommitId: 'f6672d8e480ccdecddfad3fd1b838ba369ffe6cd'

    - name: Integrate vcpkg
      shell: pwsh
      env:
        RUNNER_WORKSPACE: ${{ runner.workspace }}
      run: |
        vcpkg integrate install --vcpkg-root "$env:RUNNER_WORKSPACE\b\vcpkg"

    - name: Cache vcpkg installed packages
      uses: actions/cache@v4
      with:
        path: msvc-full-features/vcpkg_installed
        key: vcpkg-installed-sdl3-${{ hashFiles('msvc-full-features/vcpkg.json', '.github/vcpkg_triplets/x64-windows-static.cmake') }}-f6672d8e480ccdecddfad3fd1b838ba369ffe6cd

    - name: Download ccache
      uses: robinraju/release-downloader@v1.9
      with:
        repository: 'ccache/ccache'
        tag: 'v4.6.1'
        fileName: 'ccache-4.6.1-windows-x86_64.zip'

    - name: Install ccache
      shell: pwsh
      run: |
        unzip ccache-4.6.1-windows-x86_64.zip
        cp ccache-4.6.1-windows-x86_64/ccache.exe ccache-4.6.1-windows-x86_64/cl.exe
        cp ccache-4.6.1-windows-x86_64/ccache.exe ccache-4.6.1-windows-x86_64/clang-cl.exe
        mv ccache-4.6.1-windows-x86_64 $env:CDDA_CCACHE_PATH

    - name: Get ccache vars
      id: get-vars
      shell: bash
      run: |
        echo "datetime=$(/bin/date -u "+%Y%m%d%H%M")" >> $GITHUB_OUTPUT
        echo "ccache-path=$(echo "$APPDATA\\ccache")" >> $GITHUB_OUTPUT

    - name: ccache cache files
      uses: actions/cache@v4
      with:
        path: ${{ steps.get-vars.outputs.ccache-path }}
        key: ccache-${{ github.ref_name }}-${{ runner.os }}-msvc--${{ steps.get-vars.outputs.datetime }}
        restore-keys: |
          ccache-master-${{ runner.os }}-msvc--

    - name: Configure ccache
      shell: pwsh
      run: |
        & "$env:CDDA_CCACHE_PATH\ccache.exe" -M 10G
        & "$env:CDDA_CCACHE_PATH\ccache.exe" -s -v
        & "$env:CDDA_CCACHE_PATH\ccache.exe" -z

    - name: Symlink intermediates to C
      shell: pwsh
      run: |
        mkdir -p "$env:TEMP\objwin"
        New-Item -ItemType SymbolicLink -Target "$env:TEMP\objwin" objwin

    # --- our additions: version stamp + slim ZIP -------------------------------
    - name: Strip CC-Sounds for slim ZIP
      shell: bash
      run: |
        rm -rf data/sound/CC-Sounds data/sound/CC-Sounds.zip
        # Hide these tracked-file deletions from git's dirty check so prebuild.cmd's
        # `git describe --dirty` does NOT append "-dirty", keeping the baked version
        # equal to the mac/linux builds' clean commit hash for the MP handshake.
        git ls-files -d -z | git update-index --assume-unchanged -z --stdin

    - name: Write version header
      shell: bash
      run: |
        # The MP handshake (mp_version_commit_id) compares the SHORT git commit
        # token after stripping "-dirty"/"+SDL3". On MSVC, version.cpp #includes
        # version.h, so we stamp it with the same `git rev-parse --short HEAD`
        # the mac/linux Makefile bakes — guaranteeing all three release binaries
        # reduce to the identical token and can connect to each other.
        #
        # BUT: the vcxproj runs msvc-full-features/prebuild.cmd as a PreBuildEvent,
        # which does `git describe --tags --always --dirty --match cdda-experimental-*`
        # and OVERWRITES version.h with the result. Our fork's origin carries all of
        # upstream's cdda-experimental-* tags, so that describe would yield a
        # tag string (e.g. cdda-experimental-...-gHASH) instead of the short SHA —
        # silently desyncing the Windows handshake from mac/linux (whose Makefile
        # uses --exact-match and is immune). Strip those tags from the CI checkout
        # so prebuild's describe falls through to --always == the short SHA. This
        # touches zero upstream files (the tags are remote; we only drop locals).
        git tag -l 'cdda-experimental-*' | xargs -r git tag -d >/dev/null 2>&1 || true
        SHA="$(git rev-parse --short HEAD)"
        printf '// NOLINT(cata-header-guard)\n#define VERSION "%s"\n' "$SHA" > src/version.h
        echo "Stamped src/version.h with VERSION=$SHA"

    - name: Build cataclysm-tiles.exe
      shell: pwsh
      run: |
        # SDL3 tiles release. We build only the game target (+ its zzip dep) —
        # upstream additionally builds the test + JsonFormatter targets, which a
        # release package does not ship; skipping them saves CI time. Everything
        # about HOW deps are produced (MSVC, vcpkg, x64-windows-static, SDL3) is
        # identical to upstream.
        msbuild -m -p:Configuration=Release -p:Platform=x64 -p:UseSDL3=true `
          "-target:Cataclysm-vcpkg-static" `
          msvc-full-features/Cataclysm-vcpkg-static.sln

    - name: ccache stats
      shell: pwsh
      run: |
        & "$env:CDDA_CCACHE_PATH\ccache.exe" -s -v

    - name: Dump vcpkg logs if build failed
      if: failure()
      shell: pwsh
      env:
        RUNNER_WORKSPACE: ${{ runner.workspace }}
      run: |
        Get-ChildItem "$env:RUNNER_WORKSPACE/b/vcpkg/buildtrees" -ErrorAction SilentlyContinue |
        Foreach-Object {
            Get-ChildItem $_.FullName -Filter *.log -ErrorAction SilentlyContinue |
            Foreach-Object {
              echo "================ $($_.FullName) ================"
              type $_.FullName
            }
        }

    - name: Package ZIP
      id: package
      # msys2 (not Git Bash): we need `zip`, installed into the msys2 env above.
      # Git Bash ships cp/bash but no zip, which fails this step with exit 127.
      shell: msys2 {0}
      env:
        VERSION: ${{ inputs.version }}
      run: |
        # The main vcxproj sets OutDir to the repo root, so cataclysm-tiles.exe
        # plus any applocal runtime DLLs (e.g. mpg123 — forced dynamic in the
        # triplet for LGPL reasons, and SDL3 GPU shadercross runtime DLLs) land
        # beside it here.
        mkdir -p Cddacoop
        cp cataclysm-tiles.exe Cddacoop/
        bash build-data/md-to-readme-txt.sh build-data/README-cddacoop.md > Cddacoop/README.txt
        cp -r data gfx Cddacoop/
        # SOUND build still wants the sound/ tree for menu sounds; the
        # CC-Sounds pack proper is downloaded by the user later.
        [ -d data/sound ] && cp -r data/sound Cddacoop/data/ || true

        # Bundle every DLL the vcpkg applocal step copied next to the exe.
        # With x64-windows-static most deps link in; what remains are the
        # forced-dynamic ones. Log them so the first run reveals the set.
        shopt -s nullglob
        dlls=( *.dll )
        echo "Bundling ${#dlls[@]} runtime DLL(s): ${dlls[*]}"
        for d in "${dlls[@]}"; do cp "$d" Cddacoop/; done

        ZIP="cddacoop-${VERSION}-windows-x64.zip"
        zip -r "$ZIP" Cddacoop
        echo "zip-path=${ZIP}" >> "$GITHUB_OUTPUT"

    - name: Upload ZIP artifact
      uses: actions/upload-artifact@v4
      with:
        name: cddacoop-windows-x64
        path: ${{ steps.package.outputs.zip-path }}
        retention-days: 30
        if-no-files-found: error
