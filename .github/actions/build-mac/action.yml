name: Build macOS binary
description: >
  Build cataclysm-tiles (SDL3 universal), package it as Cddacoop.app inside a
  DMG + zip, and upload them as workflow artifacts named cddacoop-macos-<arch>.
  SDL3 (>=3.4.0) isn't packaged universal anywhere, so the whole SDL3 stack is
  built from source as a fat (arm64+x86_64) binary, mirroring upstream's mac
  SDL3 recipe. MSL shaders are compiled at make time via SDL_shadercross.

inputs:
  arch:
    description: >
      universal (arm64+x86_64 fat binary — the default), or arm64 / x64.
      Used verbatim in the artifact/zip name (cddacoop-...-macos-<arch>).
    required: false
    default: universal
  version:
    description: 'Version string baked into the binary.'
    required: true

outputs:
  dmg-path:
    description: 'Filesystem path of the produced DMG, relative to the repo root.'
    value: ${{ steps.package.outputs.dmg-path }}
  zip-path:
    description: 'Filesystem path of the produced .zip, relative to the repo root.'
    value: ${{ steps.package.outputs.zip-path }}

runs:
  using: composite
  steps:
    - name: Install build dependencies (brew)
      shell: bash
      run: |
        # glslang -> glslangValidator (GLSL->SPIR-V); shadercross then does
        # SPIR-V->MSL.  dylibbundler bundles the SDL3 dylibs into the .app.
        HOMEBREW_NO_AUTO_UPDATE=yes HOMEBREW_NO_INSTALL_CLEANUP=yes brew install \
          gettext dylibbundler create-dmg ccache glslang cmake ninja

    - name: Install MacPorts (universal codec deps for SDL3_mixer/ttf)
      uses: melusina-org/setup-macports@c7eb59386def259a274627092566a7f7b8d219b1 # v1

    - name: Install universal MacPorts packages
      shell: bash
      run: |
        # SDL3_mixer/ttf link these as real dylibs (VENDORED=OFF for mixer); the
        # mac artifact is universal, so each (plus libiconv, a transitive dep of
        # flac/wavpack) must be +universal.  Mirrors upstream's mac SDL3 job.
        sudo port install freetype +universal pkgconfig +universal \
            libiconv +universal libogg +universal flac +universal \
            libvorbis +universal wavpack +universal mpg123 +universal

    - name: Cache SDL3 stack (universal, from source)
      id: cache-sdl3
      uses: actions/cache@v4
      with:
        path: ${{ runner.workspace }}/sdl3_prefix
        key: sdl3-stack-universal-sdl-3.4.10-image-3.4.4-ttf-3.2.2-mixer-3.2.4-${{ runner.os }}-v1

    - name: Build SDL3 stack from source (universal)
      if: steps.cache-sdl3.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euxo pipefail
        PREFIX="${{ runner.workspace }}/sdl3_prefix"
        export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:/opt/local/lib/pkgconfig"
        # wavpack's Findwavpack.cmake uses plain find_library (no pkg-config),
        # so /opt/local must be on CMAKE_PREFIX_PATH.
        export CMAKE_PREFIX_PATH="$PREFIX:/opt/local"
        ARCH_ARG='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
        BUILD_ROOT="${RUNNER_TEMP}/sdl3-build"; mkdir -p "$PREFIX" "$BUILD_ROOT"; cd "$BUILD_ROOT"

        git clone --depth 1 --branch release-3.4.10 https://github.com/libsdl-org/SDL.git sdl3_src
        cmake -S sdl3_src -B sdl3_build "$ARCH_ARG" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PREFIX" -DBUILD_SHARED_LIBS=ON
        cmake --build sdl3_build -j"$(sysctl -n hw.ncpu)"; cmake --install sdl3_build

        git clone --depth 1 --branch release-3.4.4 --recurse-submodules --shallow-submodules https://github.com/libsdl-org/SDL_image.git sdl3_image_src
        cmake -S sdl3_image_src -B sdl3_image_build "$ARCH_ARG" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DSDLIMAGE_VENDORED=ON -DSDLIMAGE_DEPS_SHARED=OFF -DSDLIMAGE_STRICT=ON \
            -DSDLIMAGE_BACKEND_IMAGEIO=OFF \
            -DSDLIMAGE_PNG=ON -DSDLIMAGE_PNG_LIBPNG=ON -DSDLIMAGE_JPG=ON \
            -DSDLIMAGE_AVIF=OFF -DSDLIMAGE_JXL=OFF -DSDLIMAGE_TIF=OFF -DSDLIMAGE_WEBP=OFF \
            -DPNG_ARM_NEON=off -DBUILD_SHARED_LIBS=ON
        cmake --build sdl3_image_build -j"$(sysctl -n hw.ncpu)"; cmake --install sdl3_image_build

        git clone --depth 1 --branch release-3.2.2 --recurse-submodules --shallow-submodules https://github.com/libsdl-org/SDL_ttf.git sdl3_ttf_src
        cmake -S sdl3_ttf_src -B sdl3_ttf_build "$ARCH_ARG" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DSDLTTF_VENDORED=ON -DSDLTTF_STRICT=ON -DSDLTTF_PLUTOSVG=OFF -DBUILD_SHARED_LIBS=ON
        cmake --build sdl3_ttf_build -j"$(sysctl -n hw.ncpu)"; cmake --install sdl3_ttf_build

        git clone --depth 1 --branch release-3.2.4 --recurse-submodules --shallow-submodules https://github.com/libsdl-org/SDL_mixer.git sdl3_mixer_src
        cmake -S sdl3_mixer_src -B sdl3_mixer_build "$ARCH_ARG" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DSDLMIXER_VENDORED=OFF -DSDLMIXER_DEPS_SHARED=OFF -DSDLMIXER_STRICT=ON \
            -DSDLMIXER_FLAC=ON -DSDLMIXER_FLAC_LIBFLAC=ON -DSDLMIXER_FLAC_DRFLAC=OFF \
            -DSDLMIXER_MP3=ON -DSDLMIXER_MP3_MPG123=ON -DSDLMIXER_MP3_MPG123_SHARED=OFF -DSDLMIXER_MP3_DRMP3=OFF \
            -DSDLMIXER_VORBIS_VORBISFILE=ON -DSDLMIXER_VORBIS_STB=OFF -DSDLMIXER_VORBIS_TREMOR=OFF \
            -DSDLMIXER_WAVPACK=ON \
            -DSDLMIXER_OPUS=OFF -DSDLMIXER_MOD=OFF -DSDLMIXER_MIDI=OFF -DSDLMIXER_GME=OFF \
            -DBUILD_SHARED_LIBS=ON
        cmake --build sdl3_mixer_build -j"$(sysctl -n hw.ncpu)"; cmake --install sdl3_mixer_build

    - name: Cache SDL_shadercross (for MSL shaders)
      id: cache-shadercross
      uses: actions/cache@v4
      with:
        path: ${{ runner.workspace }}/shadercross_prefix
        key: shadercross-6b06e55c-${{ runner.os }}-v1

    - name: Build SDL_shadercross from source
      if: steps.cache-shadercross.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euxo pipefail
        PREFIX="${{ runner.workspace }}/sdl3_prefix"
        SC_PREFIX="${{ runner.workspace }}/shadercross_prefix"
        SC="${RUNNER_TEMP}/SDL_shadercross"
        git clone --recursive https://github.com/libsdl-org/SDL_shadercross.git "$SC"
        cd "$SC"; git checkout 6b06e55c7c5d7e7a09a8a14f76e866dcfad5ab99; git submodule update --init --recursive
        cmake -S external/SPIRV-Cross -B spirv_cross_build -GNinja \
            -DCMAKE_BUILD_TYPE=Release -DSPIRV_CROSS_SHARED=OFF -DSPIRV_CROSS_STATIC=ON \
            -DSPIRV_CROSS_CLI=OFF -DSPIRV_CROSS_ENABLE_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/spirv_cross_prefix"
        cmake --build spirv_cross_build; cmake --install spirv_cross_build
        # DXC OFF: DXIL is Windows-only; macOS only needs MSL via SPIRV-Cross.
        cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/spirv_cross_prefix;$PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$SC_PREFIX" \
            -DSDLSHADERCROSS_VENDORED=OFF -DSDLSHADERCROSS_INSTALL=ON \
            -DSDLSHADERCROSS_CLI=ON -DSDLSHADERCROSS_SHARED=OFF -DSDLSHADERCROSS_STATIC=ON \
            -DSDLSHADERCROSS_SPIRVCROSS_SHARED=OFF -DSDLSHADERCROSS_DXC=OFF
        cmake --build build; cmake --install build

    - name: Configure SDL3 + shader env
      shell: bash
      run: |
        PREFIX="${{ runner.workspace }}/sdl3_prefix"
        SC_PREFIX="${{ runner.workspace }}/shadercross_prefix"
        {
          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig:/opt/local/lib/pkgconfig"
          echo "CMAKE_PREFIX_PATH=$PREFIX:/opt/local"
          echo "DYLD_LIBRARY_PATH=$PREFIX/lib"
        } >> "$GITHUB_ENV"
        echo "$SC_PREFIX/bin" >> "$GITHUB_PATH"

    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-mac-${{ inputs.arch }}-${{ github.sha }}
        restore-keys: |
          ccache-mac-${{ inputs.arch }}-

    - name: Configure ccache
      shell: bash
      run: |
        echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
        mkdir -p "$HOME/.ccache"; ccache -z

    - name: Write version header
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        printf '#pragma once\n#define CDDACOOP_VERSION "%s"\n' "$VERSION" \
          > src/cata_version_generated.h

    - name: Rebrand bundle identity (Cataclysm → Cddacoop)
      shell: bash
      run: |
        sed -i '' \
          -e 's|com\.cataclysmdda\.en\.cataclysm|com.cddacoop.app|g' \
          -e 's|<string>Cataclysm</string>|<string>Cddacoop</string>|' \
          build-data/osx/Info.plist
        git update-index --assume-unchanged build-data/osx/Info.plist

    - name: Build cataclysm-tiles (SDL3)
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
      run: |
        # SDL3 via pkg-config (no FRAMEWORK on SDL3 — frameworks were SDL2).
        # Shaders (MSL) compile at make time via shadercross on PATH.
        UNI=""
        [ "$ARCH" = "universal" ] && UNI="UNIVERSAL_BINARY=1"
        make -j"$(sysctl -n hw.logicalcpu)" \
          TILES=1 SOUND=1 SDL3=1 LINTJSON=0 PCH=0 \
          NATIVE=osx CLANG=1 CCACHE=1 \
          USE_HOME_DIR=1 RELEASE=1 \
          $UNI \
          cataclysm-tiles

    - name: ccache stats
      shell: bash
      run: ccache -s

    - name: Strip CC-Sounds for slim DMG
      shell: bash
      run: rm -rf data/sound/CC-Sounds data/sound/CC-Sounds.zip

    - name: Package .app bundle
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
      run: |
        # `make app` produces Cataclysm.app; with SDL3 (no FRAMEWORK) the
        # trailing dylibbundler bundles the SDL3 dylibs the binary links from
        # the prefix into Contents/Resources/. data/shaders (with the compiled
        # .msl) is copied in by the app target.
        UNI=""
        [ "$ARCH" = "universal" ] && UNI="UNIVERSAL_BINARY=1"
        make app \
          TILES=1 SOUND=1 SDL3=1 LINTJSON=0 PCH=0 \
          NATIVE=osx CLANG=1 \
          USE_HOME_DIR=1 RELEASE=1 \
          $UNI
        mv Cataclysm.app Cddacoop.app

    - name: Install Cddacoop launcher
      shell: bash
      run: |
        cp build-data/osx/cddacoop-launcher.sh Cddacoop.app/Contents/MacOS/Cataclysm.sh
        chmod +x Cddacoop.app/Contents/MacOS/Cataclysm.sh

    - name: Audit bundle (universal-fat check)
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
      run: |
        RES="Cddacoop.app/Contents/Resources"
        echo "=== Bundle Mach-O contents ==="; ls "$RES" | grep -E '\.dylib$|\.framework$' || true
        otool -L "$RES/cataclysm-tiles" 2>/dev/null | head -25 || otool -L Cddacoop.app/Contents/MacOS/cataclysm-tiles | head -25
        if [ "$ARCH" = "universal" ]; then
          echo "=== Universal (fat) architecture check ==="
          FATBAD=$(mktemp)
          find "Cddacoop.app" -type f \( -name "*.dylib" -o -name "cataclysm-tiles" \) -print0 |
            while IFS= read -r -d '' f; do
              file "$f" | grep -q "Mach-O" || continue
              archs="$(lipo -archs "$f" 2>/dev/null || true)"
              if ! { echo "$archs" | grep -qw x86_64 && echo "$archs" | grep -qw arm64; }; then
                echo "  FAIL: $f is not fat (archs: ${archs:-none})" | tee -a "$FATBAD"
              else
                echo "  ok:   $f ($archs)"
              fi
            done
          if [ -s "$FATBAD" ]; then rm -f "$FATBAD"; echo "Aborting: single-arch Mach-O in universal build."; exit 1; fi
          rm -f "$FATBAD"; echo "  OK: every bundled Mach-O is fat (arm64 + x86_64)"
        fi

    - name: Stage payload (.app + README)
      shell: bash
      run: |
        rm -rf /tmp/cddacoop-stage; mkdir -p /tmp/cddacoop-stage
        cp -R Cddacoop.app /tmp/cddacoop-stage/
        bash build-data/md-to-readme-txt.sh build-data/README-cddacoop.md > /tmp/cddacoop-stage/README.txt

    - name: Build DMG and .zip
      id: package
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ARCH: ${{ inputs.arch }}
      run: |
        DMG="cddacoop-${VERSION}-macos-${ARCH}.dmg"
        ZIP="cddacoop-${VERSION}-macos-${ARCH}.zip"
        create-dmg \
          --volname "Cddacoop ${VERSION}" \
          --window-size 540 380 --icon-size 96 \
          --icon "Cddacoop.app" 140 190 --icon "README.txt" 270 320 \
          --app-drop-link 400 190 --hide-extension "Cddacoop.app" \
          --no-internet-enable \
          "${DMG}" /tmp/cddacoop-stage
        echo "dmg-path=${DMG}" >> "$GITHUB_OUTPUT"
        ditto -c -k --sequesterRsrc /tmp/cddacoop-stage "${ZIP}"
        echo "zip-path=${ZIP}" >> "$GITHUB_OUTPUT"

    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: cddacoop-macos-${{ inputs.arch }}-dmg
        path: ${{ steps.package.outputs.dmg-path }}
        retention-days: 30
        if-no-files-found: error

    - name: Upload .zip artifact
      uses: actions/upload-artifact@v4
      with:
        name: cddacoop-macos-${{ inputs.arch }}
        path: ${{ steps.package.outputs.zip-path }}
        retention-days: 30
        if-no-files-found: error
