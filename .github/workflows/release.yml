name: Release

# Triggered by pushing a semver tag (e.g. v0.1.0). Builds macOS Apple Silicon,
# macOS Intel, and Windows x64 in parallel, then publishes a public GitHub
# Release with all artifacts plus the CC-Sounds pack attached.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # create releases, upload assets

env:
  BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('preview-{0}', github.sha) }}

jobs:
  build-mac:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, arch: arm64 }  # Apple Silicon
          - { runner: macos-13, arch: x64 }    # Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/build-mac
        with:
          arch: ${{ matrix.arch }}
          version: ${{ env.BUILD_VERSION }}

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/build-windows
        with:
          version: ${{ env.BUILD_VERSION }}

  release:
    name: Publish GitHub Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: cddacoop-macos-arm64
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: cddacoop-macos-x64
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: cddacoop-windows-x64
          path: dist/

      - name: Stage CC-Sounds pack from repo
        run: cp data/sound/CC-Sounds.zip dist/cc-sounds.zip

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.BUILD_VERSION }}
          tag_name: ${{ env.BUILD_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Downloads

            - **macOS Apple Silicon** — `cddacoop-${{ env.BUILD_VERSION }}-macos-arm64.zip`
            - **macOS Intel** — `cddacoop-${{ env.BUILD_VERSION }}-macos-x64.zip`
            - **Windows x64** — `cddacoop-${{ env.BUILD_VERSION }}-windows-x64.zip`
            - **CC-Sounds pack** — `cc-sounds.zip` (the .app prompts on first launch to download this)

            macOS zips contain `Cddacoop.app` + `README.md`.
            Unsigned — first launch on macOS needs **right-click → Open**;
            Windows SmartScreen needs **More info → Run anyway**.

            ## What's new

            <!-- maintainer: edit this section before publishing -->

          files: |
            dist/cddacoop-*-macos-arm64.zip
            dist/cddacoop-*-macos-x64.zip
            dist/cddacoop-*-windows-x64.zip
            dist/cc-sounds.zip
