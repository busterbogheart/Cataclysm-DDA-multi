name: Release

# Build selected platforms, then optionally upload to the preview release
# on the site.  Triggered by tag push (all platforms) or manual dispatch
# with platform toggles.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mac_arm:
        description: 'Build macOS Apple Silicon'
        type: boolean
        default: true
      mac_intel:
        description: 'Build macOS Intel'
        type: boolean
        default: false
      windows:
        description: 'Build Windows x64'
        type: boolean
        default: false
      upload:
        description: 'Upload to preview release on site'
        type: boolean
        default: false

permissions:
  contents: write  # create releases, upload assets

env:
  BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('preview-{0}', github.sha) }}
  PREVIEW_TAG: preview-arm-20260524

jobs:
  build-mac-arm:
    name: Build macOS (arm64)
    if: >-
      github.ref_type == 'tag'
      || github.event.inputs.mac_arm == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/build-mac
        with:
          arch: arm64
          version: ${{ env.BUILD_VERSION }}

  build-mac-intel:
    name: Build macOS (x64)
    if: >-
      github.ref_type == 'tag'
      || github.event.inputs.mac_intel == 'true'
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/build-mac
        with:
          arch: x64
          version: ${{ env.BUILD_VERSION }}

  build-windows:
    name: Build Windows (x64)
    if: >-
      github.ref_type == 'tag'
      || github.event.inputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/build-windows
        with:
          version: ${{ env.BUILD_VERSION }}

  upload:
    name: Upload to preview release
    needs: [build-mac-arm, build-mac-intel, build-windows]
    # Run if upload was requested or it's a tag push. Allow skipped deps
    # (platform wasn't selected) — only fail on actual failure.
    if: >-
      !failure() && !cancelled()
      && (github.event.inputs.upload == 'true' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/ || echo "No artifacts"

      - name: Upload to preview release
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in dist/cddacoop-*.zip dist/cddacoop-*.dmg; do
            [ -f "$f" ] || continue
            BASENAME=$(basename "$f")
            # Delete old asset with matching suffix if it exists
            SUFFIX=$(echo "$BASENAME" | grep -o 'macos-arm64\|macos-x64\|windows-x64')
            if [ -n "$SUFFIX" ]; then
              OLD=$(gh release view "$PREVIEW_TAG" --json assets --jq ".assets[] | select(.name | test(\"$SUFFIX\")) | .name" 2>/dev/null || true)
              if [ -n "$OLD" ]; then
                echo "Replacing $OLD with $BASENAME"
                gh release delete-asset "$PREVIEW_TAG" "$OLD" --yes || true
              fi
            fi
            gh release upload "$PREVIEW_TAG" "$f" --clobber
          done

      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.BUILD_VERSION }}
          tag_name: ${{ env.BUILD_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Downloads

            - **macOS Apple Silicon** — `cddacoop-${{ env.BUILD_VERSION }}-macos-arm64.zip`
            - **macOS Intel** — `cddacoop-${{ env.BUILD_VERSION }}-macos-x64.zip`
            - **Windows x64** — `cddacoop-${{ env.BUILD_VERSION }}-windows-x64.zip`
            - **CC-Sounds pack** — `cc-sounds.zip` (the .app prompts on first launch to download this)

            macOS zips contain `Cddacoop.app` + `README.md`.
            Unsigned — first launch on macOS needs **right-click → Open**;
            Windows SmartScreen needs **More info → Run anyway**.

          files: |
            dist/cddacoop-*-macos-arm64.zip
            dist/cddacoop-*-macos-x64.zip
            dist/cddacoop-*-windows-x64.zip
