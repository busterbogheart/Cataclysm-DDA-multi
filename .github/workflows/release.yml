name: Release

# Build selected platforms, then optionally upload to a per-build release on
# GitHub. Triggered by tag push (all platforms) or manual dispatch with
# platform toggles.
#
# Each preview build → its own release `preview-<sha7>`. The releases page
# becomes the build archive — players who need to pair with a friend on an
# older sig can grab the matching build. The site (cddacoop.com) always
# fetches the newest non-draft release via the GitHub API, so the homepage
# download auto-points at the freshest build.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mac:
        description: 'Build macOS (universal — arm64 + Intel in one binary)'
        type: boolean
        default: true
      windows:
        description: 'Build Windows x64'
        type: boolean
        default: false
      linux:
        description: 'Build Linux x64'
        type: boolean
        default: false
      upload:
        description: 'Upload to preview release on site'
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write  # create releases, upload assets

jobs:
  setup:
    name: Compute build version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Compute version
        id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          # Always use the short commit SHA as the build identifier — this is
          # what the binary stamps into its VERSION string and what the in-game
          # version handshake compares.  Using the tag name here caused the
          # site download label to say "v1.0.2" while in-game said "dc7c514e",
          # confusing players trying to verify they're on matching builds.
          VER="${SHA:0:10}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Build version: $VER"

  build-mac:
    name: Build macOS (universal)
    needs: setup
    # One universal (arm64 + x86_64) binary built on Apple Silicon. Replaces
    # the old per-arch arm64 + macos-13 Intel jobs: the macOS SDK on macos-14
    # carries both slices and the SDL2 frameworks are universal, so a single
    # fat binary runs natively on both architectures. This removes the
    # dependency on the deprecated macos-13 Intel runner.
    if: >-
      github.ref_type == 'tag'
      || github.event.inputs.mac == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/build-mac
        with:
          arch: universal
          version: ${{ needs.setup.outputs.version }}

  build-windows:
    name: Build Windows (x64)
    needs: setup
    if: >-
      github.ref_type == 'tag'
      || github.event.inputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/build-windows
        with:
          version: ${{ needs.setup.outputs.version }}

  build-linux:
    name: Build Linux (x64)
    needs: setup
    if: >-
      github.ref_type == 'tag'
      || github.event.inputs.linux == 'true'
    # Build on an older Ubuntu so the glibc baseline is broad enough to run on
    # most current distros (newer runners raise the minimum glibc).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/build-linux
        with:
          version: ${{ needs.setup.outputs.version }}

  upload:
    name: Publish release
    needs: [setup, build-mac, build-windows, build-linux]
    # Run if upload was requested or it's a tag push. Allow skipped deps
    # (platform wasn't selected) — only fail on actual failure.
    if: >-
      !failure() && !cancelled()
      && (github.event.inputs.upload == 'true' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/ || echo "No artifacts"

      - name: Build release body
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')

          # Find the most recent prior preview release tag so we can scope
          # "what changed" to commits since then. Falls back to last 10
          # commits if no prior preview exists (first-ever build, or all
          # previews pruned). Tagged v* releases get the auto-generated
          # changelog appended below; we still list recent commits here for
          # consistency.
          PREV=$(gh release list -R "$REPO" --limit 30 \
                   --json tagName,isPrerelease \
                   --jq '.[] | select(.isPrerelease == true and (.tagName | startswith("preview-"))) | .tagName' \
                 | grep -v "^${VERSION}\$" \
                 | head -1 || true)

          if [ -n "$PREV" ] && git rev-parse --verify "refs/tags/$PREV" >/dev/null 2>&1; then
            CHANGES=$(git log --format="- %s" "$PREV..HEAD" | head -20)
            COMPARE="commits since [\`$PREV\`](https://github.com/$REPO/releases/tag/$PREV)"
          else
            CHANGES=$(git log --format="- %s" -10 HEAD)
            COMPARE="last 10 commits"
          fi
          [ -z "$CHANGES" ] && CHANGES="- (no new commits)"

          # Heredoc into the body file. Don't quote 'EOF' — we want $VAR
          # expansion. Backticks need escaping; raw URLs are fine.
          cat > /tmp/body.md <<EOF
          **Built:** $BUILD_DATE
          **SHA:** \`$(git rev-parse --short HEAD)\` (matches the version line shown on the main menu and the zip filename)

          ## What changed ($COMPARE)

          $CHANGES

          ## Downloads

          - **macOS (Apple Silicon + Intel)** — \`cddacoop-${VERSION}-macos-universal.zip\`
          - **Windows x64** — \`cddacoop-${VERSION}-windows-x64.zip\`
          - **Linux x64** — \`cddacoop-${VERSION}-linux-x64.tar.gz\` (extract, run \`./cddacoop.sh\`; built on Ubuntu 22.04 / glibc 2.35+)
          - **CC-Sounds pack** — \`cc-sounds.zip\` (the .app prompts on first launch to download this)

          The macOS zip is a universal binary — one download runs natively on
          both Apple Silicon and Intel Macs (macOS 10.15+).
          macOS zips contain \`Cddacoop.app\` + \`README.txt\`.
          Unsigned — first launch on macOS needs **right-click → Open**;
          Windows SmartScreen needs **More info → Run anyway**.

          ---

          Co-op partners must run **matching builds** — the in-game version
          handshake rejects mismatched sigs. The short SHA on the main menu
          matches the SHA in the zip filename, so your friend can pick the
          right build from the [releases page](https://github.com/$REPO/releases).
          EOF

          echo "=== body.md ==="
          cat /tmp/body.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.setup.outputs.version }}
          tag_name: ${{ needs.setup.outputs.version }}
          draft: false
          # Preview builds (dispatch) → prerelease. Tagged v* → stable.
          prerelease: ${{ github.ref_type != 'tag' }}
          # Auto-generated notes are appended below body for tagged
          # releases — they reflect a real cross-version changelog window.
          # Previews already list "what changed" above.
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          body_path: /tmp/body.md
          files: |
            dist/cddacoop-*-macos-universal.zip
            dist/cddacoop-*-windows-x64.zip
            dist/cddacoop-*-linux-x64.tar.gz

      # Mirror the same artifacts to itch.io (cddacoop.itch.io/cddacoop) so the
      # itch listing stays pinned to this commit alongside the site. Pushes the
      # UNZIPPED contents per platform channel: butler diffs at the file level,
      # so the unchanged data/tiles/sound (hundreds of MB) upload once and each
      # preview only re-sends the changed binary — and itch-app users get patch
      # auto-updates. The binary inside is the same commit either way, so itch
      # builds still pass the in-game version handshake against site builds.
      # Additive and non-critical: a missing key or an itch outage no-ops and
      # never blocks the GitHub release or the site rebuild below.
      - name: Push builds to itch.io
        continue-on-error: true
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          VERSION: ${{ needs.setup.outputs.version }}
          ITCH_TARGET: cddacoop/cddacoop
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "BUTLER_API_KEY not set — skipping itch.io push"
            exit 0
          fi

          # Fetch butler (itch.io's official upload tool).
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V

          # Unzip one artifact into a clean staging dir, then push that dir to
          # its itch channel. Skips silently if the platform wasn't built in
          # this run (partial dispatch) — matching the site's per-platform
          # fallback, so itch and the site stay on the same per-platform commit.
          push() {
            archive_glob="$1"; channel="$2"; stage="$3"
            file=$(ls $archive_glob 2>/dev/null | head -1 || true)
            if [ -z "$file" ]; then
              echo "no artifact for $channel ($archive_glob) — skipping"
              return 0
            fi
            rm -rf "$stage" && mkdir -p "$stage"
            case "$file" in
              *.zip)    unzip -q "$file" -d "$stage" ;;
              *.tar.gz) tar -xzf "$file" -C "$stage" ;;
            esac
            echo "=== pushing $channel from $file ==="
            ./butler push "$stage" "$ITCH_TARGET:$channel" --userversion "$VERSION"
          }

          push "dist/cddacoop-*-macos-universal.zip" mac     stage/mac
          push "dist/cddacoop-*-windows-x64.zip"     windows stage/windows
          push "dist/cddacoop-*-linux-x64.tar.gz"    linux   stage/linux

          ./butler status "$ITCH_TARGET" || true

      # Kick the site rebuild directly. We can't rely on notify-site.yml's
      # `release: published` trigger here: this release is created by the
      # default GITHUB_TOKEN, and GitHub deliberately does NOT fire workflow
      # events for token-created releases (recursion guard). So the site would
      # stay pinned at the previous build's (now-deleted) download URL until a
      # manual nudge. Dispatch catacoop-site's deploy ourselves with the PAT.
      # notify-site.yml still covers manual `gh release edit` asset swaps,
      # which fire under a human PAT and so trigger the event normally.
      - name: Trigger site rebuild
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          gh workflow run deploy.yml \
            --repo busterbogheart/catacoop-site \
            --ref main
