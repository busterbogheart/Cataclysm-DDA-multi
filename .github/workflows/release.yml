name: Release

# Triggered by pushing a semver tag (e.g. v0.1.0). Builds Apple Silicon and
# Intel binaries in parallel, then publishes a public GitHub Release with the
# two DMGs attached and auto-generated notes.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # create releases, upload assets

jobs:
  build:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, arch: arm64 }  # Apple Silicon
          - { runner: macos-13, arch: x64 }    # Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tag annotations + git describe

      - name: Build + package
        uses: ./.github/actions/build-mac
        with:
          arch: ${{ matrix.arch }}
          version: ${{ github.ref_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: cddacoop-macos-arm64
          path: dist/

      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: cddacoop-macos-x64
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true  # uses repo's release-notes config
          body: |
            ## Downloads

            - **macOS Apple Silicon** — `cddacoop-${{ github.ref_name }}-macos-arm64.dmg`
            - **macOS Intel** — `cddacoop-${{ github.ref_name }}-macos-x64.dmg`

            Unsigned — first launch needs **right-click → Open** to bypass
            Gatekeeper. After that, the app launches normally.

            ## What's new

            <!-- maintainer: edit this section before publishing -->

          files: |
            dist/cddacoop-*-macos-arm64.dmg
            dist/cddacoop-*-macos-x64.dmg
