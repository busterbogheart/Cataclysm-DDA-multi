name: MP Release


on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'data/**'
      - '.github/workflows/mp-release.yml'

concurrency:
  group: mp-release
  cancel-in-progress: true

jobs:
  build:
    name: Build (x86_64)
    runs-on: macos-14
    if: "!startsWith(github.event.head_commit.message, 'save:')"

    steps:
      - uses: actions/checkout@v4

      - name: Cache x86_64 Homebrew prefix
        id: cache-brew
        uses: actions/cache@v4
        with:
          path: /usr/local
          key: brew-x86_64-sdl2-pkgconf-ccache-v1
          save-always: true

      - name: Install x86_64 Homebrew and dependencies
        if: steps.cache-brew.outputs.cache-hit != 'true'
        run: |
          arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" </dev/null
          arch -x86_64 /usr/local/bin/brew install pkgconf sdl2 sdl2_image sdl2_mixer sdl2_ttf freetype gettext ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-x86_64-${{ github.sha }}
          restore-keys: |
            ccache-x86_64-
          save-always: true

      - name: Build
        run: |
          arch -x86_64 env \
            PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/opt/sdl2/lib/pkgconfig:/usr/local/opt/sdl2_image/lib/pkgconfig:/usr/local/opt/sdl2_ttf/lib/pkgconfig:/usr/local/opt/sdl2_mixer/lib/pkgconfig:/usr/local/opt/freetype/lib/pkgconfig" \
            make -j$(sysctl -n hw.logicalcpu) TILES=1 SOUND=1 LINTJSON=0 PCH=0 \
            CC="/usr/local/bin/ccache clang" CXX="/usr/local/bin/ccache clang++" \
            cataclysm-tiles
          mv cataclysm-tiles cataclysm-tiles-x86_64

      - name: Bundle dylibs
        run: |
          python3 - << 'PYEOF'
          import subprocess, os, shutil, zipfile, stat
          from collections import deque

          bin_name = "cataclysm-tiles-x86_64"
          seen = {}   # basename -> original full path

          SYSTEM_PREFIXES = ("/usr/lib/", "/System/", "/Library/Apple/")

          def otool_deps(path):
              r = subprocess.run(["otool", "-L", path], capture_output=True, text=True)
              for line in r.stdout.splitlines()[1:]:
                  yield line.strip().split(" (")[0].strip()

          def get_rpaths(path, loader_dir=None):
              r = subprocess.run(["otool", "-l", path], capture_output=True, text=True)
              rpaths = []
              lines = r.stdout.splitlines()
              for i, line in enumerate(lines):
                  if "LC_RPATH" in line:
                      for j in range(i, min(i + 5, len(lines))):
                          if "path " in lines[j]:
                              rp = lines[j].strip().split("path ")[1].split(" (")[0].strip()
                              if rp.startswith("@loader_path") and loader_dir:
                                  rp = os.path.normpath(rp.replace("@loader_path", loader_dir))
                              elif rp.startswith("@"):
                                  break
                              rpaths.append(rp)
                              break
              return rpaths

          def resolve_dep(dep, rpaths, loader_path=None):
              if any(dep.startswith(p) for p in SYSTEM_PREFIXES):
                  return None
              if dep.startswith("/") and os.path.exists(dep):
                  return dep
              if dep.startswith("@rpath/"):
                  name = dep[len("@rpath/"):]
                  for rp in rpaths:
                      candidate = os.path.join(rp, name)
                      if os.path.exists(candidate):
                          return candidate
              if dep.startswith("@loader_path/") and loader_path:
                  candidate = os.path.join(loader_path, dep[len("@loader_path/"):])
                  candidate = os.path.normpath(candidate)
                  if os.path.exists(candidate):
                      return candidate
              return None

          queue = deque([(bin_name, None)])
          while queue:
              current, loader_dir = queue.popleft()
              if loader_dir is None:
                  loader_dir = os.path.dirname(os.path.abspath(current))
              rpaths = get_rpaths(current, loader_dir)
              for dep in otool_deps(current):
                  resolved = resolve_dep(dep, rpaths, loader_dir)
                  if not resolved:
                      continue
                  name = os.path.basename(resolved)  # use symlink name before realpath
                  resolved = os.path.realpath(resolved)
                  if name in seen:
                      continue
                  seen[name] = resolved
                  shutil.copy2(resolved, name)
                  os.chmod(name, 0o755)
                  subprocess.run(["install_name_tool", "-id",
                                  f"@executable_path/{name}", name], check=True)
                  queue.append((name, os.path.dirname(resolved)))

          print(f"Bundled {len(seen)} dylibs:")
          for n in sorted(seen): print(f"  {n}  <-  {seen[n]}")

          all_files = [bin_name] + list(seen.keys())
          for target in all_files:
              rpaths = get_rpaths(target)
              loader_dir = os.path.dirname(os.path.abspath(target))
              for dep in otool_deps(target):
                  name = os.path.basename(dep)
                  if name in seen:
                      subprocess.run(["install_name_tool", "-change",
                                      dep, f"@executable_path/{name}", target], check=True)
                  elif dep.startswith("@rpath/"):
                      rname = dep[len("@rpath/"):]
                      if rname in seen:
                          subprocess.run(["install_name_tool", "-change",
                                          dep, f"@executable_path/{rname}", target], check=True)

          for target in all_files:
              subprocess.run(["codesign", "--force", "--sign", "-", target], check=True)

          launcher = "launch.command"
          with open(launcher, "w") as f:
              f.write('#!/bin/bash\n')
              f.write('cd "$(dirname "$0")"\n')
              f.write('xattr -cr . 2>/dev/null\n')
              f.write('exec ./cataclysm-tiles-x86_64 "$@"\n')
          os.chmod(launcher, 0o755)

          with zipfile.ZipFile("cataclysm-tiles-x86_64.zip", "w",
                               compression=zipfile.ZIP_DEFLATED) as zf:
              zf.write(bin_name)
              zf.write(launcher)
              for name in seen:
                  zf.write(name)
          print(f"Zipped {bin_name} + {launcher} + {len(seen)} dylibs")
          PYEOF

      - uses: actions/upload-artifact@v4
        with:
          name: cataclysm-tiles-x86_64
          path: cataclysm-tiles-x86_64.zip
          retention-days: 7

  release:
    name: Publish latest release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          body: |
            Auto-built from `master` on every push.

            **Clone the repo first, then unzip the binary + dylibs into the repo root.**

            | File | Platform |
            |---|---|
            | `cataclysm-tiles-x86_64.zip` | Intel Mac |

            ### First-run on macOS (Intel)
            macOS will quarantine downloaded files. Two options:

            **Option A — double-click launcher (easiest):**
            Right-click `launch.command` → Open → Open Anyway.
            This strips quarantine and starts the game. Subsequent launches work normally.

            **Option B — Terminal:**
            ```
            cd /path/to/cataclysm-folder
            xattr -cr .
            ./cataclysm-tiles-x86_64
            ```
          files: |
            cataclysm-tiles-x86_64.zip
