name: MP Release


on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'data/**'
      - '.github/workflows/mp-release.yml'

jobs:
  build:
    name: Build (x86_64)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install x86_64 Homebrew and dependencies
        run: |
          arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" </dev/null
          arch -x86_64 /usr/local/bin/brew install sdl2 sdl2_image sdl2_mixer sdl2_ttf freetype gettext

      - name: Cache build objects
        uses: actions/cache@v4
        with:
          path: obj/
          key: obj-x86_64-${{ github.sha }}
          restore-keys: obj-x86_64-

      - name: Build
        run: |
          arch -x86_64 make -j$(sysctl -n hw.logicalcpu) TILES=1 SOUND=1 LINTJSON=0 PCH=0 cataclysm-tiles
          mv cataclysm-tiles cataclysm-tiles-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: cataclysm-tiles-x86_64
          path: cataclysm-tiles-x86_64
          retention-days: 7

  release:
    name: Publish latest release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          body: |
            Auto-built from `master` on every push.

            **Download the binary and place it in your cloned repo directory.**

            | File | Platform |
            |---|---|
            | `cataclysm-tiles-x86_64` | Intel Mac |

            The data files (tiles, sound, save) come from the repo — clone it first, then drop the binary in.
          files: |
            cataclysm-tiles-x86_64
