name: MP Release


on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'data/**'
      - '.github/workflows/mp-release.yml'

concurrency:
  group: mp-release
  cancel-in-progress: true

jobs:
  build:
    name: Build (x86_64)
    runs-on: macos-14
    if: "!startsWith(github.event.head_commit.message, 'save:')"

    steps:
      - uses: actions/checkout@v4

      - name: Install x86_64 Homebrew and dependencies
        run: |
          arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" </dev/null
          arch -x86_64 /usr/local/bin/brew install sdl2 sdl2_image sdl2_mixer sdl2_ttf freetype gettext ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-x86_64-${{ github.sha }}
          restore-keys: ccache-x86_64-

      - name: Build
        run: |
          arch -x86_64 make -j$(sysctl -n hw.logicalcpu) TILES=1 SOUND=1 LINTJSON=0 PCH=0 \
            CC="/usr/local/bin/ccache clang" CXX="/usr/local/bin/ccache clang++" \
            cataclysm-tiles
          mv cataclysm-tiles cataclysm-tiles-x86_64

      - name: Bundle dylibs
        run: |
          python3 - << 'PYEOF'
          import subprocess, os, shutil, zipfile
          from collections import deque

          bin_name = "cataclysm-tiles-x86_64"
          seen = {}   # basename -> original full path

          def otool_deps(path):
              r = subprocess.run(["otool", "-L", path], capture_output=True, text=True)
              for line in r.stdout.splitlines()[1:]:
                  yield line.strip().split(" (")[0].strip()

          def get_rpaths(path):
              r = subprocess.run(["otool", "-l", path], capture_output=True, text=True)
              rpaths = []
              lines = r.stdout.splitlines()
              for i, line in enumerate(lines):
                  if "LC_RPATH" in line:
                      for j in range(i, min(i + 5, len(lines))):
                          if "path " in lines[j]:
                              rp = lines[j].strip().split("path ")[1].split(" (")[0].strip()
                              rpaths.append(rp)
                              break
              return rpaths

          def resolve_dep(dep, rpaths):
              if dep.startswith("/usr/local/opt/") or dep.startswith("/usr/local/lib/"):
                  return dep if os.path.exists(dep) else None
              if dep.startswith("@rpath/"):
                  name = dep[len("@rpath/"):]
                  for rp in rpaths:
                      candidate = os.path.join(rp, name)
                      if os.path.exists(candidate):
                          return candidate
              return None

          queue = deque([bin_name])
          while queue:
              current = queue.popleft()
              rpaths = get_rpaths(current)
              for dep in otool_deps(current):
                  resolved = resolve_dep(dep, rpaths)
                  if not resolved:
                      continue
                  name = os.path.basename(resolved)
                  if name in seen:
                      continue
                  seen[name] = resolved
                  shutil.copy2(resolved, name)
                  os.chmod(name, 0o755)
                  subprocess.run(["install_name_tool", "-id",
                                  f"@executable_path/{name}", name], check=True)
                  queue.append(name)

          all_files = [bin_name] + list(seen.keys())
          for target in all_files:
              rpaths = get_rpaths(target)
              for dep in otool_deps(target):
                  name = os.path.basename(dep)
                  if name in seen:
                      subprocess.run(["install_name_tool", "-change",
                                      dep, f"@executable_path/{name}", target], check=True)
                  elif dep.startswith("@rpath/"):
                      rname = dep[len("@rpath/"):]
                      if rname in seen:
                          subprocess.run(["install_name_tool", "-change",
                                          dep, f"@executable_path/{rname}", target], check=True)

          for target in all_files:
              subprocess.run(["codesign", "--force", "--sign", "-", target], check=True)

          with zipfile.ZipFile("cataclysm-tiles-x86_64.zip", "w",
                               compression=zipfile.ZIP_DEFLATED) as zf:
              zf.write(bin_name)
              for name in seen:
                  zf.write(name)
          print(f"Zipped {bin_name} + {len(seen)} dylibs")
          PYEOF

      - uses: actions/upload-artifact@v4
        with:
          name: cataclysm-tiles-x86_64
          path: cataclysm-tiles-x86_64.zip
          retention-days: 7

  release:
    name: Publish latest release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          body: |
            Auto-built from `master` on every push.

            **Download the binary and place it in your cloned repo directory.**

            | File | Platform |
            |---|---|
            | `cataclysm-tiles-x86_64.zip` | Intel Mac |

            The data files (tiles, sound, save) come from the repo — clone it first, then unzip the binary and dylibs into that directory.
          files: |
            cataclysm-tiles-x86_64.zip
